        <!-- Catalog side bar -->
        <div id="category_popup" class="fixed left-0 top-0 flex flex-col w-72 md:w-60 h-full bg-[#051770] p-2.5 gap-y-5 z-50 transform -translate-x-full transition-transform duration-300 ease-in-out shadow-xl">
            <div class="flex items-center justify-between">
                <h1 class="uppercase font-bold text-2xl">Category</h1>
                <div id="close_popup" class="w-6 h-6 bg-[#2749F5] flex items-center justify-center pb-1 rounded-2xl cursor-pointer">x</div>
            </div>
            <div id="all_channels" class="flex items-center gap-2 border border-[#0929C8] p-1 rounded-lg cursor-pointer hover:bg-[#071B9C]">

                    <div class="absolute w-4 h-4 bg-[#2749F5] rounded-2xl animate-ping"></div>
                    <div class="relative w-4 h-4 bg-[#2749F5] rounded-2xl"></div>
                </div>

            </div>
            <div id="category_div" class="flex flex-col overflow-y-auto scrollbar-none [&::-webkit-scrollbar]:hidden">
            </div>
        </div>

        <!-- Main Player & Stats -->
        <main class="ml-0 md:ml-100 w-full flex-1 flex flex-col justify-start md:justify-center p-4 md:p-8 gap-4 min-w-0">
            <div class="w-full h-56 sm:h-96 md:h-150 rounded-2xl bg-[#2749F5] overflow-hidden">

                            <p class="text-xs text-gray-400">

                            </p>
                        </div>
                    </div>
                </div>
                
                <div class="flex flex-col justify-center p-2 bg-[#030E44] rounded-lg">

                    <h2 class="text-lg font-bold truncate"><div id="loading_palying" class="h-2 animate-pulse rounded bg-[#0B1FF4]"></div></h2>
                </div>

                <div class="p-2 bg-[#030E44] rounded-lg">
